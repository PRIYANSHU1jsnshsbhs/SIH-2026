services:
  - type: web
    name: lapus-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: lapus-postgres
          property: connectionString
      - key: RENDER_DATABASE_USER
        fromDatabase:
          name: lapus-postgres
          property: user
      - key: RENDER_DATABASE_PASSWORD
        fromDatabase:
          name: lapus-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: VASPATTRIBUTION_DATASET_PATH
        value: /app/crypto_mock_dataset.json
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: LOGGING_LEVEL_IN_SIH_VASPATTRIBUTION
        value: INFO
      - key: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
        value: INFO
      # Redis is not used by the current MVP. Keep it from making the
      # application health endpoint fail when no managed Redis is provisioned.
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75.0

databases:
  - name: lapus-postgres
    region: singapore
    plan: free
    databaseName: vaspdb
    user: lapus
    postgresMajorVersion: "17"
    ipAllowList: []
