spring:
  datasource:
    url: jdbc:h2:mem:vaspdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
          secret: ${JWT_SECRET:supersecretkeythatisatleast32byteslongforhs256}
server:
  port: 8081


vaspattribution:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  limits:
    max-hops: ${MAX_HOPS:5}
    max-nodes: ${MAX_NODES:5000}
    investigation-timeout: ${INVESTIGATION_TIMEOUT:3600s}
  blockchain:
    ethereum:
      api-key: ${ETHERSCAN_API_KEY:}
      url: ${ETHERSCAN_URL:https://api.etherscan.io/api}

logging:
  level:
    in.sih.vaspattribution: DEBUG
    org.springframework.security: DEBUG
