spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///vaspattribution_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: testsecretkeythatisatleast32byteslongforhs256

vaspattribution:
  cors:
    allowed-origins: http://localhost:5173
  limits:
    max-hops: 5
    max-nodes: 500
    investigation-timeout: 30s
